<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - Freelance Payments</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
  <!-- Preserve query parameters for React app -->
  <script>
    // Preserve query parameters when React app loads
    // This ensures session_id and other params are available to App.tsx
    // Store in sessionStorage as backup before React loads
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const sessionId = urlParams.get('session_id');
      if (sessionId) {
        // Store in sessionStorage as backup (React will read from URL first)
        sessionStorage.setItem('stripe_session_id', sessionId);
      }
    })();
  </script>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 font-sans selection:bg-emerald-500/30">
  <div id="root"></div>
  <script type="module" src="/src/job.tsx"></script>
</body>

</html>
