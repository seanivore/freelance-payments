<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/assets/css/styles.css">

  <script>
    /**
     * 404 ROUTING HANDLER - Single Page Architecture for Job Pages
     *
     * Routes job_id URLs (e.g., /uid-amx-856#contract) to job.html template
     * Uses hash anchors to navigate between sections: contract, invoice, payment-1, payment-2
     */
    (async function () {
      // Ensure DOM is ready
      if (document.readyState === 'loading') {
        await new Promise(resolve => document.addEventListener('DOMContentLoaded', resolve));
      }

      const path = window.location.pathname;
      const hash = window.location.hash; // e.g., #contract, #invoice, #payment-1
      const cleanPath = path.replace(/^\/|\/$/g, ''); // Remove leading/trailing slashes

      try {
        // Extract job_id from path (should start with uid-)
        const jobId = cleanPath;

        // Basic validation: must start with uid- and contain only alphanumeric and hyphens
        if (!jobId || !jobId.match(/^uid-[a-z0-9-]+$/i)) {
          throw new Error('Invalid job ID format. Job IDs must start with "uid-"');
        }

        // Load manifest to verify job_id exists
        const manifestResponse = await fetch('/assets/js/manifest.json');
        if (!manifestResponse.ok) {
          throw new Error('Manifest not found');
        }

        const manifest = await manifestResponse.json();

        // Find job entry by job_id (search through manifest entries)
        let jobEntry = null;
        for (const [lookupKey, entry] of Object.entries(manifest.jobs || {})) {
          if (entry.job_id === jobId) {
            jobEntry = entry;
            break;
          }
        }

        if (!jobEntry) {
          throw new Error(`Job ${jobId} not found in manifest`);
        }

        // Store job data in sessionStorage
        sessionStorage.setItem('jobId', jobId);
        sessionStorage.setItem('jobPath', jobEntry.file_path);
        sessionStorage.setItem('lookupKey', Object.keys(manifest.jobs).find(k => manifest.jobs[k].job_id === jobId));

        // Load job JSON data
        const jobResponse = await fetch(`/${jobEntry.file_path}`);
        if (!jobResponse.ok) {
          throw new Error('Job data not found');
        }

        const jobData = await jobResponse.json();
        sessionStorage.setItem('jobData', JSON.stringify(jobData));

        // Fetch the job.html template
        const templateResponse = await fetch('/job.html');
        if (!templateResponse.ok) {
          throw new Error('Job template not found');
        }

        const templateHTML = await templateResponse.text();

        // Parse the template to extract body content and scripts
        const parser = new DOMParser();
        const doc = parser.parseFromString(templateHTML, 'text/html');

        // Replace body content
        document.body.innerHTML = doc.body.innerHTML;

        // Copy over title and meta tags
        document.title = doc.title || `Payment - ${jobId}`;
        Array.from(doc.head.querySelectorAll('meta')).forEach(meta => {
          const existing = document.head.querySelector(`meta[name="${meta.getAttribute('name')}"]`) ||
            document.head.querySelector(`meta[property="${meta.getAttribute('property')}"]`);
          if (existing) {
            existing.parentNode.replaceChild(meta.cloneNode(true), existing);
          } else {
            document.head.appendChild(meta.cloneNode(true));
          }
        });

        // Load CSS if present in template
        Array.from(doc.head.querySelectorAll('link[rel="stylesheet"]')).forEach(link => {
          if (!document.head.querySelector(`link[href="${link.getAttribute('href')}"]`)) {
            document.head.appendChild(link.cloneNode(true));
          }
        });

        // Execute controller scripts from template
        const scripts = Array.from(doc.querySelectorAll('script[src]'));
        for (const script of scripts) {
          const scriptSrc = script.getAttribute('src');

          // Load controller scripts
          const newScript = document.createElement('script');
          newScript.src = scriptSrc.startsWith('/') ? scriptSrc : `/${scriptSrc}`;
          document.body.appendChild(newScript);
          await new Promise(resolve => {
            newScript.onload = resolve;
            newScript.onerror = resolve;
          });
        }

        // Execute inline scripts from template
        const inlineScripts = Array.from(doc.querySelectorAll('script:not([src])'));
        for (const script of inlineScripts) {
          const newScript = document.createElement('script');
          newScript.textContent = script.textContent;
          document.body.appendChild(newScript);
        }

        // After template loads, handle hash routing
        if (hash) {
          // Wait a bit for scripts to initialize, then scroll to section
          setTimeout(() => {
            const targetId = hash.substring(1); // Remove #
            const targetElement = document.getElementById(targetId);
            if (targetElement) {
              targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 100);
        }

      } catch (error) {
        console.error('❌ Error loading job page:', error);
        // Wait for body to be ready before setting innerHTML
        if (document.body) {
          document.body.innerHTML = `
            <div style="text-align: center; margin-top: 50px; font-family: sans-serif; padding: 2rem;">
              <h1>Page Not Found</h1>
              <p>Sorry, the job you're looking for doesn't exist or couldn't be loaded.</p>
              <p style="color: #666; font-size: 0.9em;">${error.message}</p>
              <a href="/" style="color: #4a9eff; text-decoration: underline; margin-top: 1rem; display: inline-block;">Return to Homepage</a>
            </div>
          `;
        } else {
          // If body doesn't exist yet, wait for DOMContentLoaded
          document.addEventListener('DOMContentLoaded', () => {
            if (document.body) {
              document.body.innerHTML = `
                <div style="text-align: center; margin-top: 50px; font-family: sans-serif; padding: 2rem;">
                  <h1>Page Not Found</h1>
                  <p>Sorry, the job you're looking for doesn't exist or couldn't be loaded.</p>
                  <p style="color: #666; font-size: 0.9em;">${error.message}</p>
                  <a href="/" style="color: #4a9eff; text-decoration: underline; margin-top: 1rem; display: inline-block;">Return to Homepage</a>
                </div>
              `;
            }
          });
        }
      }
    })();
  </script>
</head>

<body>
  <p style="text-align: center; margin-top: 50px; font-family: sans-serif; color: #666;">
    Loading...
  </p>
</body>

</html>
