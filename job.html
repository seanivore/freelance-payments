<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - Freelance Payments</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />

  <!-- Tailwind CSS -->
  <link rel="stylesheet" href="/assets/css/styles.css">

  <!-- Stripe.js (needed for checkout sections) -->
  <script src="https://js.stripe.com/v3/"></script>

  <!-- Print styles -->
  <style>
    @media print {
      .no-print {
        display: none;
      }

      @page {
        margin: 1in;
      }

      body {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      /* Hide all sections except the one being printed */
      .job-section:not(.print-active) {
        display: none;
      }
    }

    /* Smooth scrolling for hash anchors */
    html {
      scroll-behavior: smooth;
    }

    /* Section spacing */
    .job-section {
      min-height: 100vh;
      padding: 2rem 0;
    }

    /* Navigation bar */
    .job-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }

    /* PDF viewer styling - paper-like appearance with shadow */
    .pdf-viewer-container {
      background: #f5f5f5;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1), 0 2px 4px rgba(0, 0, 0, 0.06);
      margin: 2rem 0;
    }

    .pdf-viewer-container iframe {
      background: white;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    /* Error message styling */
    .error {
      color: #dc2626;
      padding: 1rem;
      background: #fee2e2;
      border-radius: 4px;
      margin: 1rem 0;
    }

    /* Signature button overlay */
    .signature-button-overlay {
      position: relative;
      margin-top: 2rem;
    }
  </style>
</head>

<body class="min-h-screen bg-background text-foreground">
  <!-- Loading state -->
  <div id="loading" class="min-h-screen flex items-center justify-center">
    <div class="text-center">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mx-auto mb-4"></div>
      <p class="text-muted-foreground">Loading...</p>
    </div>
  </div>

  <!-- Navigation bar (shown after content loads) -->
  <nav id="job-nav" class="job-nav hidden no-print">
    <div class="max-w-4xl mx-auto px-6 py-4">
      <div class="flex items-center justify-between">
        <a href="/" class="text-sm text-muted-foreground hover:text-foreground">← Back to Home</a>
        <div class="flex gap-4">
          <a href="#contract" class="text-sm hover:text-primary">Contract</a>
          <a href="#invoice" class="text-sm hover:text-primary">Invoice</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main content container -->
  <main id="job-content" class="hidden">

    <!-- Contract Section -->
    <section id="contract" class="job-section">
      <div class="max-w-4xl mx-auto px-6 print:p-0">
        <!-- PDF Viewer Container -->
        <div id="contract-pdf-viewer" class="pdf-viewer-container">
          <!-- PDF iframe will be inserted here by contract-controller.js -->
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-4 justify-center mt-4 no-print">
          <a id="contract-download-btn" href="#" download class="btn btn-outline hidden">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            Download Contract
          </a>
          <button id="contract-sign-btn" class="btn btn-primary hidden">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            Sign Contract
          </button>
        </div>

        <!-- Error/Content Container -->
        <div id="contract-content">
          <!-- Error messages or fallback content will be shown here -->
        </div>
      </div>
    </section>

    <!-- Invoice Section -->
    <section id="invoice" class="job-section">
      <div class="max-w-4xl mx-auto px-6 print:p-0">
        <!-- PDF Viewer Container -->
        <div id="invoice-pdf-viewer" class="pdf-viewer-container">
          <!-- PDF iframe will be inserted here by invoice-controller.js -->
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-4 justify-center mt-4 no-print">
          <a id="invoice-download-btn" href="#" download class="btn btn-outline hidden">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            Download Invoice
          </a>
        </div>

        <!-- Error/Content Container -->
        <div id="invoice-content">
          <!-- Error messages or fallback content will be shown here -->
        </div>
      </div>
    </section>

    <!-- Checkout Section - Payment 1 -->
    <section id="payment-1" class="job-section">
      <div class="max-w-2xl mx-auto px-6">
        <div id="checkout-content-1">
          <!-- Checkout for payment 1 will be populated here by checkout-controller.js -->
        </div>
      </div>
    </section>

    <!-- Checkout Section - Payment 2 -->
    <section id="payment-2" class="job-section">
      <div class="max-w-2xl mx-auto px-6">
        <div id="checkout-content-2">
          <!-- Checkout for payment 2 will be populated here by checkout-controller.js -->
        </div>
      </div>
    </section>

    <!-- Completion Section -->
    <section id="completion" class="job-section">
      <div class="max-w-2xl mx-auto px-6 text-center">
        <div id="completion-content">
          <!-- Completion message will be populated here -->
        </div>
      </div>
    </section>

  </main>

  <!-- Signature Modal (shadcn UI style) -->
  <div id="signature-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4 p-6">
      <h2 class="text-2xl font-semibold mb-4">Sign Contract</h2>
      
      <form id="signature-form" class="space-y-4">
        <!-- Contractor Signature -->
        <div>
          <label class="block text-sm font-medium mb-2">Contractor Name</label>
          <input type="text" id="contractor-name" value="Sean August Horvath" readonly
            class="w-full px-3 py-2 border rounded-md bg-gray-50">
        </div>
        
        <div>
          <label class="block text-sm font-medium mb-2">Contractor Date</label>
          <input type="date" id="contractor-date" required
            class="w-full px-3 py-2 border rounded-md">
        </div>

        <!-- Client Signature -->
        <div>
          <label class="block text-sm font-medium mb-2">Your Full Legal Name</label>
          <input type="text" id="client-name" required placeholder="Enter your full legal name"
            class="w-full px-3 py-2 border rounded-md">
        </div>
        
        <div>
          <label class="block text-sm font-medium mb-2">Date</label>
          <input type="date" id="client-date" required
            class="w-full px-3 py-2 border rounded-md">
        </div>

        <!-- Optional: Signature font selector -->
        <div>
          <label class="block text-sm font-medium mb-2">Signature Style (Optional)</label>
          <select id="signature-font" class="w-full px-3 py-2 border rounded-md">
            <option value="cursive">Cursive</option>
            <option value="script">Script</option>
            <option value="handwriting">Handwriting</option>
          </select>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-4 pt-4">
          <button type="button" id="modal-cancel" class="btn btn-outline flex-1">Cancel</button>
          <button type="submit" class="btn btn-primary flex-1">Sign Contract</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Load controllers -->
  <script src="/assets/js/event-tracker.js"></script>
  <script src="/assets/js/payment-router.js"></script>
  <script src="/assets/js/contract-controller.js"></script>
  <script src="/assets/js/invoice-controller.js"></script>
  <script src="/assets/js/checkout-controller.js"></script>

  <!-- Signature Modal Handler -->
  <script>
    (function() {
      'use strict';
      
      const modal = document.getElementById('signature-modal');
      const form = document.getElementById('signature-form');
      const cancelBtn = document.getElementById('modal-cancel');
      const signBtn = document.getElementById('contract-sign-btn');

      // Open modal when sign button is clicked
      if (signBtn) {
        signBtn.addEventListener('click', () => {
          modal.classList.remove('hidden');
          // Set today's date as default
          const today = new Date().toISOString().split('T')[0];
          document.getElementById('contractor-date').value = today;
          document.getElementById('client-date').value = today;
        });
      }

      // Close modal
      if (cancelBtn) {
        cancelBtn.addEventListener('click', () => {
          modal.classList.add('hidden');
        });
      }

      // Handle form submission
      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          
          const contractorName = document.getElementById('contractor-name').value;
          const contractorDate = document.getElementById('contractor-date').value;
          const clientName = document.getElementById('client-name').value;
          const clientDate = document.getElementById('client-date').value;

          if (!contractorName || !contractorDate || !clientName || !clientDate) {
            alert('Please fill in all fields.');
            return;
          }

          // Call contract controller's signing handler
          if (typeof ContractController !== 'undefined' && ContractController.handleContractSigning) {
            const jobData = ContractController.getJobData() || window._currentJobData;
            if (jobData) {
              const signatureData = {
                contractorName: contractorName,
                contractorDate: new Date(contractorDate).toISOString() + 'Z',
                clientName: clientName,
                clientDate: new Date(clientDate).toISOString() + 'Z'
              };

              await ContractController.handleContractSigning(jobData, signatureData);
              
              // Track contract signed event
              const jobId = jobData.product?.id || sessionStorage.getItem('jobId');
              if (typeof EventTracker !== 'undefined' && jobId) {
                EventTracker.trackContractSigned(jobId);
              }
              
              modal.classList.add('hidden');
            } else {
              alert('Job data not found. Please refresh the page.');
            }
          } else {
            alert('Contract controller not loaded. Please refresh the page.');
          }
        });
      }
    })();
  </script>

  <script>
    /**
     * Initialize job page
     * Determines which section to show based on state and hash anchor
     */
    (function () {
      'use strict';

      // Wait for DOM and controllers to be ready
      function init() {
        const jobDataStr = sessionStorage.getItem('jobData');
        if (!jobDataStr) {
          console.error('No job data found');
          document.getElementById('loading').innerHTML = `
            <div class="text-center">
              <h1>Error</h1>
              <p>Job data not found. Please start from the <a href="/">homepage</a>.</p>
            </div>
          `;
          return;
        }

        // Hide loading, show content
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('job-content').classList.remove('hidden');
        document.getElementById('job-nav').classList.remove('hidden');

        // Get current hash or determine from state
        const hash = window.location.hash;
        let targetSection = hash ? hash.substring(1) : null;

        // If no hash, use payment router to determine section
        if (!targetSection && typeof PaymentRouter !== 'undefined') {
          try {
            const jobData = JSON.parse(jobDataStr);
            const routeInfo = PaymentRouter.determineRoute(jobData);

            // Map route to section ID
            const routeToSection = {
              'contract': 'contract',
              'invoice': 'invoice',
              'checkout': routeInfo.paymentNumber === 1 ? 'payment-1' :
                routeInfo.paymentNumber === 2 ? 'payment-2' : 'payment-1',
              'completion': 'completion'
            };

            targetSection = routeToSection[routeInfo.route] || 'contract';

            // Update URL hash without scrolling
            history.replaceState(null, null, `#${targetSection}`);
          } catch (e) {
            console.error('Error determining route:', e);
            targetSection = 'contract';
          }
        }

        // Show target section, hide others
        if (targetSection) {
          const sections = document.querySelectorAll('.job-section');
          sections.forEach(section => {
            section.classList.add('hidden');
          });

          const targetElement = document.getElementById(targetSection);
          if (targetElement) {
            targetElement.classList.remove('hidden');
            // Scroll to section smoothly
            setTimeout(() => {
              targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
          }
        }

        // Handle hash changes (user clicks nav links)
        window.addEventListener('hashchange', function () {
          const newHash = window.location.hash.substring(1);
          const sections = document.querySelectorAll('.job-section');
          sections.forEach(section => {
            section.classList.add('hidden');
          });

          const targetElement = document.getElementById(newHash);
          if (targetElement) {
            targetElement.classList.remove('hidden');
            targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });
      }

      // Initialize when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>

</html>
