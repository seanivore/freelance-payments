name: Admin Push Workflow

# TRIGGER=admin-push
# When: Admin pushes JSON files to repo
# What: Syncs Stripe catalog, generates PDFs, builds manifest, builds & deploys Pages

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches:
      - freelance-payments

# Workflow-level concurrency ensures all runs queue sequentially
concurrency:
  group: freelance-payments-workflows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admin-push:
    # Skip if commit was made by GitHub Actions (prevents infinite loop)
    if: github.event.head_commit.author.name != 'GitHub Action'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install stripe
          pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Configure git
        run: |
          git config pull.rebase true
          git config push.autoSetupRemote true

      - name: Run admin-push script
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_TEMPLATE_CONTRACT_ID: ${{ secrets.GOOGLE_TEMPLATE_CONTRACT_ID }}
          GOOGLE_TEMPLATE_INVOICE_ID: ${{ secrets.GOOGLE_TEMPLATE_INVOICE_ID }}
          GOOGLE_TEMPLATE_BALANCE_ID: ${{ secrets.GOOGLE_TEMPLATE_BALANCE_ID }}
          GOOGLE_TEMP_FOLDER_ID: ${{ secrets.GOOGLE_TEMP_FOLDER_ID }}
        run: |
          python3 .github/scripts/orchestration/admin_push.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Install Jekyll
        run: gem install jekyll

      - name: Build Pages
        run: jekyll build --destination _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: admin-push
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
