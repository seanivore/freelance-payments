name: Process Job & Update Stripe Catalog

permissions:
  contents: write

on:
  push:
    branches:
      - freelance-payments # Update to your branch name
    paths:
      - "assets/jobs/*.json"
      - "generate_manifest.py"
  workflow_dispatch:
    inputs:
      job_id:
        description: "Optional: Specific job ID to process"
        required: false
      action:
        description: "Action to perform (sign-contract, update-payment)"
        required: false

jobs:
  process-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install stripe

      # === CONTRACT SIGNING HANDLER ===
      - name: Handle Contract Signing
        if: github.event.inputs.action == 'sign-contract'
        run: |
          python3 .github/scripts/update_job_json.py \
            sign-contract \
            "${{ github.event.inputs.job_id }}" \
            '${{ github.event.inputs.signature_data }}'

      # === PAYMENT UPDATE HANDLER ===
      - name: Handle Payment Update
        if: github.event.inputs.action == 'update-payment'
        run: |
          python3 .github/scripts/update_job_json.py \
            update-payment \
            "${{ github.event.inputs.job_id }}" \
            "${{ github.event.inputs.payment_number }}" \
            '${{ github.event.inputs.payment_data }}'

      # === MANIFEST GENERATION (only on push) ===
      - name: Generate manifest
        if: github.event_name == 'push'
        run: python3 generate_manifest.py

      - name: Check for manifest changes
        if: github.event_name == 'push'
        id: manifest-changed
        run: |
          if [ -n "$(git status --porcelain assets/js/manifest.json 2>/dev/null)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # === STRIPE PRODUCT SYNC (only on push) ===
      - name: Process Stripe Products
        if: github.event_name == 'push'
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          python3 .github/scripts/process_stripe_products.py

      # === CHECK FOR ANY CHANGES ===
      - name: Check for any changes
        id: changes-detected
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git status --short
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      # === COMMIT CHANGES (if any) ===
      - name: Commit changes
        if: steps.changes-detected.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A

          # Set commit message based on action type
          if [ "${{ github.event.inputs.action }}" == "sign-contract" ]; then
            COMMIT_MSG="🤖 Auto-update: Contract signed for ${{ github.event.inputs.job_id }}"
          elif [ "${{ github.event.inputs.action }}" == "update-payment" ]; then
            COMMIT_MSG="🤖 Auto-update: Payment #${{ github.event.inputs.payment_number }} for ${{ github.event.inputs.job_id }}"
          else
            COMMIT_MSG="🤖 Auto-update: Manifest and Stripe catalog"
          fi

          git commit -m "$COMMIT_MSG [skip ci]

          Co-Authored-By: GitHub Actions <action@github.com>"

      # === PUSH CHANGES (if any) ===
      - name: Push changes
        if: steps.changes-detected.outputs.changed == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
