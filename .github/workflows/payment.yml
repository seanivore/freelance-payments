name: Payment Workflow

# TRIGGER=payment
# When: Payment completes (Stripe webhook)
# What: Updates payment status, syncs Stripe catalog, builds manifest, builds & deploys Pages

permissions:
  contents: write
  pages: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID"
        required: true
      payload:
        description: "JSON payload with payment_number and succeeded timestamp"
        required: true

jobs:
  payment:
    runs-on: ubuntu-latest
    concurrency:
      group: freelance-payments-workflows
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install stripe

      - name: Configure git
        run: |
          git config pull.rebase true
          git config push.autoSetupRemote true

      - name: Run payment script
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          python3 .github/scripts/orchestration/payments.py \
            --job-id "${{ github.event.inputs.job_id }}" \
            --payload '${{ github.event.inputs.payload }}'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Install Jekyll
        run: gem install jekyll

      - name: Build Pages
        run: jekyll build --destination _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: payment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
