name: User Exit Events

on:
  repository_dispatch:
    types: [user_exit]
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID"
        required: true
      payload_json:
        description: "JSON array of events"
        required: true

concurrency:
  group: user-events
  cancel-in-progress: false

jobs:
  process-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install stripe

      - name: Process Exit Events
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          # Map inputs from dispatch event
          JOB_ID: ${{ github.event.inputs.job_id }}
          PAYLOAD_JSON: ${{ github.event.inputs.payload_json }}
        run: |
          python .github/scripts/orchestration/user_exit_events.py

      - name: Commit Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Stash any local changes, pull with rebase, then pop stash
          git stash || true
          git pull --rebase origin freelance-payments  # Pull before push to prevent merge conflicts
          git stash pop || true
          git add assets/jobs/*.json
          git commit -m "Update user behavior stats [skip ci]" || echo "No changes to commit"
          git push
