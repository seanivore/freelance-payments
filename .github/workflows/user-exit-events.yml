name: User Exit Events

# TRIGGER=user-exit-events
# When: User exits site, triggering /api/track-event which dispatches this workflow
# What: Updates JSON with user behavior timestamps, builds & deploys to Pages

on:
  repository_dispatch:
    types: [user_exit]
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID"
        required: true
      payload_json:
        description: "JSON array of events"
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: user-events-${{ github.event.inputs.job_id || 'default' }}
  cancel-in-progress: false  # Queue workflows instead of canceling to prevent data loss

jobs:
  process-events:
    runs-on: ubuntu-latest
    outputs:
      needs_deploy: ${{ steps.commit.outputs.needs_deploy }}

    steps:
      - uses: actions/checkout@v4
        with:
          # CRITICAL FIX for BUG_01_016: Checkout branch instead of specific commit
          # This prevents detached HEAD state which causes "src refspec does not match any" push errors
          ref: freelance-payments
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install stripe

      - name: Process Exit Events
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
          PAYLOAD_JSON: ${{ github.event.inputs.payload_json }}
        run: |
          echo "🧾 Job ID: $JOB_ID"
          python - <<'PY'
          import json, os, hashlib
          payload = os.environ.get("PAYLOAD_JSON", "")
          try:
              data = json.loads(payload)
              count = len(data) if isinstance(data, list) else 0
          except Exception:
              count = 0
          print(f"🧮 Payload event count: {count}")
          print(f"🔐 Payload sha256: {hashlib.sha256(payload.encode('utf-8')).hexdigest()}")
          PY

          # Ensure we're on the branch and up to date before processing
          if ! git branch --show-current | grep -q freelance-payments; then
            git checkout freelance-payments || git checkout -b freelance-payments origin/freelance-payments
          fi
          git fetch origin freelance-payments
          git pull --rebase origin freelance-payments
          
          python .github/scripts/orchestration/user_exit_events.py || EXIT_CODE=$?
          if [ "${EXIT_CODE:-0}" -eq 2 ]; then
            echo "⚠️  Merge conflict detected - will resolve in commit step"
            exit 0
          elif [ "${EXIT_CODE:-0}" -ne 0 ]; then
            exit $EXIT_CODE
          fi

      - name: Commit Changes
        id: commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Check if we have local changes to commit
          if git diff --quiet && git diff --cached --quiet; then
            echo "ℹ️  No local changes to commit"
            echo "needs_deploy=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Stage our changes
          git add assets/jobs/*.json

          # Commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Update user behavior stats"
            git push origin freelance-payments
            echo "✅ Successfully pushed changes"
            echo "needs_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️  No changes to commit"
            echo "needs_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.commit.outputs.needs_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        if: steps.commit.outputs.needs_deploy == 'true'
        run: npm ci

      - name: Build
        if: steps.commit.outputs.needs_deploy == 'true'
        run: npm run build

      - name: Upload artifact
        if: steps.commit.outputs.needs_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: process-events
    if: needs.process-events.outputs.needs_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
