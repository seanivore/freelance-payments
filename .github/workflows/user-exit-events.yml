name: User Exit Events

on:
  repository_dispatch:
    types: [user_exit]
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID"
        required: true
      payload_json:
        description: "JSON array of events"
        required: true

concurrency:
  group: user-events-${{ github.event.inputs.job_id || 'default' }}
  cancel-in-progress: false  # Queue workflows instead of canceling to prevent data loss

jobs:
  process-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # CRITICAL FIX for BUG_01_016: Checkout branch instead of specific commit
          # This prevents detached HEAD state which causes "src refspec does not match any" push errors
          # We checkout the branch and then fetch latest in the commit step to ensure we're up to date
          ref: freelance-payments
          fetch-depth: 0  # Fetch full history to ensure correct commit context

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install stripe

      - name: Process Exit Events
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          # Map inputs from dispatch event
          JOB_ID: ${{ github.event.inputs.job_id }}
          PAYLOAD_JSON: ${{ github.event.inputs.payload_json }}
        run: |
          echo "🧾 Job ID: $JOB_ID"
          python - <<'PY'
          import json, os, hashlib
          payload = os.environ.get("PAYLOAD_JSON", "")
          try:
              data = json.loads(payload)
              count = len(data) if isinstance(data, list) else 0
          except Exception:
              count = 0
          print(f"🧮 Payload event count: {count}")
          print(f"🔐 Payload sha256: {hashlib.sha256(payload.encode('utf-8')).hexdigest()}")
          PY

          # Store payload for potential re-processing
          echo "$PAYLOAD_JSON" > /tmp/event_payload.json
          
          # Ensure we're on the branch and up to date before processing
          if ! git branch --show-current | grep -q freelance-payments; then
            git checkout freelance-payments || git checkout -b freelance-payments origin/freelance-payments
          fi
          git fetch origin freelance-payments
          git pull --rebase origin freelance-payments
          
          python .github/scripts/orchestration/user_exit_events.py || EXIT_CODE=$?
          if [ "${EXIT_CODE:-0}" -eq 2 ]; then
            echo "⚠️  Merge conflict detected - will resolve in commit step"
            exit 0  # Don't fail workflow, let commit step handle it
          elif [ "${EXIT_CODE:-0}" -ne 0 ]; then
            exit $EXIT_CODE  # Fail for other errors
          fi

      - name: Commit Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Check if we have local changes to commit
          if git diff --quiet && git diff --cached --quiet; then
            echo "ℹ️  No local changes to commit"
            exit 0
          fi
          
          # Stage our changes
          git add assets/jobs/*.json

          # Commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Update user behavior stats"
            git push origin freelance-payments
            echo "✅ Successfully pushed changes"

            # Signal that we need to trigger deploy
            echo "NEEDS_DEPLOY=true" >> $GITHUB_ENV
          else
            echo "ℹ️  No changes to commit"
          fi

      - name: Trigger Vercel Deploy
        if: env.NEEDS_DEPLOY == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            echo "🚀 Triggering Vercel deployment..."
            curl -X POST "$VERCEL_DEPLOY_HOOK" || echo "⚠️  Deploy hook failed, Vercel may still deploy from push"
            echo "✅ Deploy hook triggered"
          else
            echo "ℹ️  No VERCEL_DEPLOY_HOOK secret configured - relying on push-triggered deploy"
          fi
