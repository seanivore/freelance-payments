name: GitHub Pages Build

# Pages build workflow
# Always builds after orchestrator completes (via workflow_run trigger)
# Also builds for non-orchestrator pushes (CSS/HTML changes)

on:
  push:
    branches:
      - freelance-payments
  workflow_run:
    workflows: ["Orchestrate Workflow"]
    types:
      - completed

jobs:
  build:
    runs-on: ubuntu-latest
    # Build logic:
    # - If triggered by workflow_run (orchestrator finished): Always build ✅
    # - If triggered by push:
    #   * Skip if author is "GitHub Action" (orchestrator commit - wait for workflow_run instead)
    #   * Build if author is you (non-orchestrator changes like CSS/HTML)
    if: |
      github.event_name == 'workflow_run' ||
      (github.event_name == 'push' && github.event.head_commit.author.name != 'GitHub Action')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Install Jekyll
        run: gem install jekyll

      - name: Build with Jekyll
        run: jekyll build --destination _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
