name: GitHub Pages Build

# Pages build workflow
# With simplified flow: sync_catalog only commits if changes are made
# So this build will run once per push (either from initial push or from orchestrator commit)

on:
  push:
    branches:
      - freelance-payments

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
