name: Orchestrate Workflow

permissions:
  contents: write

on:
  push:
    branches:
      - freelance-payments
    paths:
      - "assets/jobs/*.json"
      - ".github/scripts/orchestration/*.py"
  workflow_dispatch:
    inputs:
      action:
        description: "Action type (sign-contract, update-payment, track-event)"
        required: true
        type: choice
        options:
          - sign-contract
          - update-payment
          - track-event
      job_id:
        description: "Job ID"
        required: true
      payload:
        description: "JSON payload"
        required: true

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    # Ensure only one workflow runs at a time (prevents conflicts)
    concurrency:
      group: workflow-orchestrate
      cancel-in-progress: false # Wait for current workflow to finish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # Full history for git diff

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install stripe
          pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Configure git auto-pull
        run: |
          git config pull.rebase true
          git config push.autoSetupRemote true

      - name: Run workflow
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_TEMPLATE_CONTRACT_ID: ${{ secrets.GOOGLE_TEMPLATE_CONTRACT_ID }}
          GOOGLE_TEMPLATE_INVOICE_ID: ${{ secrets.GOOGLE_TEMPLATE_INVOICE_ID }}
          GOOGLE_TEMP_FOLDER_ID: ${{ secrets.GOOGLE_TEMP_FOLDER_ID }}
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            # TRIGGER=admin-push
            python3 .github/scripts/orchestration/admin_push.py
          elif [ "${{ github.event.inputs.action }}" == "update-payment" ]; then
            # TRIGGER=payment
            python3 .github/scripts/orchestration/payments.py \
              --job-id "${{ github.event.inputs.job_id }}" \
              --payload '${{ github.event.inputs.payload }}'
          else
            # TRIGGER=user-behavior (sign-contract or track-event)
            python3 .github/scripts/orchestration/user_behavior.py \
              --job-id "${{ github.event.inputs.job_id }}" \
              --action "${{ github.event.inputs.action }}" \
              --payload '${{ github.event.inputs.payload }}'
          fi
