<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Freelance Payments</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />

  <!-- Tailwind CSS -->
  <link rel="stylesheet" href="/assets/css/styles.css">

  <!-- Stripe.js -->
  <script src="https://js.stripe.com/v3/"></script>
</head>

<body class="min-h-screen bg-background text-foreground">
  <div id="loading" class="min-h-screen flex items-center justify-center">
    <div class="text-center">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mx-auto mb-4"></div>
      <p class="text-muted-foreground">Loading checkout...</p>
    </div>
  </div>

  <div id="checkout-content" class="hidden max-w-2xl mx-auto p-6">
    <!-- Checkout will be populated here -->
  </div>

  <script src="/assets/js/checkout-controller.js"></script>
</body>

</html>
